name: minishell

services:
  minishell:
    image: ghcr.io/joshw34/dev_containers/minishell:latest
    pull_policy: always
    container_name: minishell
    command: /bin/bash -c "/usr/local/bin/setup.sh && /usr/local/bin/start_ssh.sh"
    environment:
      - DISPLAY=${DISPLAY}
    ports:
      - "50002:50002"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/${CONTAINER_HOME_DIR}/.Xauthority:rw
      - minishell:${CONTAINER_HOME_DIR}
      - ${HOST_NVIM_CONFIG_DIR}:${CONTAINER_NVIM_CONFIG_DIR}
      - ${HOST_WORK_DIR}:${CONTAINER_WORK_DIR}
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    network_mode: "bridge"
    hostname: minishell
    restart: unless-stopped

volumes:
  minishell:
